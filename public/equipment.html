<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profile Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/equipment.css">
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        function doShowPrev(fileCtrl, imgId) {
            const file = fileCtrl.files[0];
            if (file) {
                document.getElementById(imgId).src = URL.createObjectURL(file);
            }
        }
        $(document).ready(function () {
            $("#txtAmt").prop("disabled", true);
            $("input[name='type']").change(function () {
                if ($(this).val() == "Sale") {
                    $("#txtAmt").prop("disabled", false).focus();
                } else {
                    $("#txtAmt").prop("disabled", true).val("0");
                }
            });

        });

    </script>
    <script>
        function setEmail() {
            document.getElementById("txtEmail").value = localStorage.getItem("activeUser");
            document.getElementById("txtEmail").readOnly = true;
        }
    </script>
</head>

<body onload="setEmail()">
    <div class="profileForm">
        <form class="row g-3" action="/equipment" method="post" enctype="multipart/form-data">
            <div class="text-center mb-4">
                <h2>Avail Equipment</h2>
            </div>
            <!-- Information -->
            <div class="col-12">
                <label>Email ID</label>
                <input type="text" class="form-control" name="txtEmail" id="txtEmail" placeholder="Enter Email ID">
            </div>
            <div class="col-md-6">
                <label>Medical Equipment Type</label>
                <input type="text" class="form-control" name="txtEquip" id="txtEquip" placeholder="Equipment Type">
            </div>
            <div class="col-md-6">
                <label>Condition</label>
                <select class="form-select" name="condition" id="condition">
                    <option selected disabled>Select Condition</option>
                    <option>Excellent</option>
                    <option>Good</option>
                    <option>Average</option>
                    <option>Poor</option>
                </select>
            </div>
            <div class="d-flex align-items-center gap-5 mt-4 mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="type" id="donation" value="Donation">
                    <label class="form-check-label" for="donation">Donation</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="type" id="sale" value="Sale">
                    <label class="form-check-label" for="sale">For Sale</label>
                </div>
                <div class="col-md-5">
                    <label>Amount</label>
                    <input type="number" class="form-control" id="txtAmt" name="txtAmt" value="0" disabled>
                </div>

            </div>
            <!-- Pic 1 -->
            <div class="col-md-6">
                <div class="upload-box text-center">
                    <img id="prevpic1" src="./pics/upload_image.png" class="preview-img">
                    <input type="file" hidden id="pic1" name="pic1" onchange="doShowPrev(this,'prevpic1')">
                    <br>
                    <label for="pic1" class="btn btn-outline-primary mt-3">Upload Pic</label>
                </div>
            </div>
            <!-- Pic 2 -->
            <div class="col-md-6">
                <div class="upload-box text-center">
                    <img id="prevpic2" src="./pics/upload_image.png" class="preview-img">
                    <input type="file" hidden id="pic2" name="pic2" onchange="doShowPrev(this,'prevpic2')">
                    <br>
                    <label for="pic2" class="btn btn-outline-primary mt-3">Upload Pic</label>
                </div>
            </div>

            <div class="mt-4">
                <label class="form-label fw-bold">Other Information</label>
                <textarea class="form-control" rows="3" placeholder="Additional details (optional)" name="txtInfo"
                    id="txtInfo"></textarea>
            </div>
            <!-- buttons -->
            <div class="text-center mb-4">
                <button type="submit" class="btn btn-primary profile-btn">Avail for Needys</button>
            </div>
        </form>
    </div>
</body>

</html>
