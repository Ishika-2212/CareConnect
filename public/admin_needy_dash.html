<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Donor Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/admin_donor.css">
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <script>
        let myModule = angular.module("module", []);
        let myController = myModule.controller("controller", function ($scope, $http) {

            $scope.doShowAll = function () {
                let url = "/fetch-all_needy";
                $http.get(url).then(function (resp) {
                    $scope.jsonArray = resp.data;
                }, function (err) {
                    alert(err);
                });
            }
        })
    </script>
</head>

<body ng-app="module" ng-controller="controller">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                Needy Management System
            </span>
            <button class="btn btn-light" ng-click="doShowAll()">Refresh Records</button>
        </div>
    </nav>
    <div class="container-fluid px-4 mt-4">
        <div class="row justify-content-center mt-4 mb-4">
            <div class="col-md-6">
                <input type="text" class="form-control shadow" placeholder="Search Needy" ng-model="searchText">
            </div>
        </div>
        <div class="card-header bg-white">
            <h4 class="text-primary fw-bold mb-0">
                Registered Donors
            </h4>
        </div>
        <div class="card-body">
            <table class="table-primary table table-striped table-hover text-center align-middle">
                <thead>
                    <tr>
                        <th>Sr.No.</th>
                        <th>Email</th>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Address</th>
                        <th>Aadhar Card Pic</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="obj in jsonArray">
                        <td>{{$index+1}}</td>
                        <td>{{obj.email}}</td>
                        <td>{{obj.name}}</td>
                        <td>{{obj.mobile}}</td>
                        <td>{{obj.address}}</td>
                        <td><img src="{{obj.fronturl}}" width="100" height="100" alt="" class="aadhar"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
