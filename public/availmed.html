<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="CSS/aprofile.css">
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
  <link rel="shortcut icon" href="favicon/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="manifest" href="favicon/site.webmanifest">
</head>
<script>
  function doShowPrev(fileCtrl, imgId) {
    const file = fileCtrl.files[0];
    if (file) {
      document.getElementById(imgId).src = URL.createObjectURL(file);
    }
  }
</script>
<script>
  function setEmail(){
    document.getElementById("txtEmail").value=localStorage.getItem("activeUser");
    document.getElementById("txtEmail").readOnly = true;
  }
</script>

<body onload="setEmail()">
  <div class="profileForm">
    <form class="row" action="/availprofile" method="post" enctype="multipart/form-data">
      <div class="col-12 text-center mb-5">
        <h2>Avail Medicines</h2>
        <p class="text-muted"> Fill in the medicine details to make it available. </p>
      </div>
      
      <!-- Image  -->
      <div class="col-md-4 text-center">
         <div class="upload-box text-center">
        <input type="file" id="medpic" name="medpic" hidden onchange="doShowPrev(this,'medpreview')">
        <img id="medpreview" src="./pics/upload_image.png" class="medpreview">
        <label for="medpic" class="btn btn-outline-primary mt-3">Upload Medicine Image</label>
      </div>
      </div>

      <!-- Information -->
      <div class="col-md-8 row g-3">
          <div class="col-12">
            <label>Email ID</label>
            <input type="text" class="form-control" name="txtEmail" id="txtEmail" placeholder="Enter Email ID">
          </div>
          <div class="col-md-6">
            <label>Medicine Name</label>
            <input type="text" class="form-control" name="txtMedicine" id="txtMedicine" placeholder="Enter Medicine Name">
          </div>
          <div class="col-md-6">
            <label>Expiry Date</label>
            <input type="date" class="form-control" name="txtExpiry" id="txtExpiry" placeholder="Enter Expiry Date">
          </div>
          <div class="col-md-6">
            <label>Company</label>
            <input type="text" class="form-control" name="txtCompany" id="txtCompany" placeholder="Enter Company Name">
          </div>
          <div class="col-md-6">
            <label>Packing</label>
            <select class="form-select" name="ptype" id="ptype">
              <option selected disabled>Select Packing</option>
              <option>Tablet</option>
              <option>Syrup</option>
              <option>Injection</option>
            </select>
          </div>
          <div class="col-md-6">
            <label>Quantity</label>
            <input type="number" class="form-control" name="txtQty" id="txtQty" placeholder="Enter Quantity">
          </div>
          <div class="col-md-6">
            <label>Other Details</label>
            <input type="text" class="form-control" name="txtOther" id="txtOther" placeholder="Enter Other Details">
          </div>
          <div class="col-12 text-center">
            <button class="btn btn-primary">Avail Medicine</button>
          </div>
        </div>
    </form>
  </div>
</body>

</html>
