<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Needy Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.3/angular.min.js"></script>
    <link rel="stylesheet" href="CSS/dash_donor.css">
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
</head>

<body>
    <!-- nav bar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="pics/logo.avif" class="logo" alt="Logo">
                <span class="site-name">CareConnect</span>
            </a>

            <div class="ms-auto"><a class="btn btn-outline-danger logout-btn" href="/"><i
                        class="bi bi-box-arrow-right"></i> Logout</a></div>
        </div>
    </nav>
    <div class="row row-cols-1 row-cols-md-3 g-3">
        <!-- Profile Card -->
        <div class="col">
            <div class="card">
                <img src="pics/profilepic.png" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">Profile</h5>
                    <p class="card-text">Manage your personal information and contact details.</p>
                    <a href="/needy_profile" class="btn btn-primary">Open Profile</a>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="pics/medicinepic.webp" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">Medicine</h5>
                    <p class="card-text">Search available donated medicines in your area.</p>
                    <a href="/ngo_finder" class="btn btn-primary">Find Medicines</a>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="pics/medical_equipment.png" class="card-img-top" alt="...">
                <div class="card-body">
                    <h5 class="card-title">Medical Equipment</h5>
                    <p class="card-text">Search available medical equipment for your needs.</p>
                    <a href="/equip_finder" class="btn btn-primary">Find Equipment</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
