<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/needyprofile.css">
    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg">
    <link rel="shortcut icon" href="favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="manifest" href="favicon/site.webmanifest">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <title>Document</title>
    <script>
        function doShowPrev(fileCtrl, imgId) {
            const file = fileCtrl.files[0];
            if (file) {
                document.getElementById(imgId).src = URL.createObjectURL(file);
            }
        }
        $(document).ready(function () {
            $("#txtAmt").prop("disabled", true);
            $("input[name='type']").change(function () {
                if ($(this).val() == "Sale") {
                    $("#txtAmt").prop("disabled", false).focus();
                } else {
                    $("#txtAmt").prop("disabled", true).val("0");
                }
            });

        });
    </script>
    <script>
        function setEmail() {
            document.getElementById("txtEmail").value = localStorage.getItem("activeUser");
            document.getElementById("txtEmail").readOnly = true;
        }
    </script>
</head>

<body onload="setEmail()">
    <center>
        <div class="profileForm">
            <form class="row g-3" action="/ai-read-pic" method="post" enctype="multipart/form-data">
                <div class="text-center mb-4">
                    <p class="heading">Needy Profile</p>
                    <p class="sub-heading">
                        Complete your profile and upload your Aadhaar card for verification
                    </p>
                </div>
                <div class="col-md-6">
                    <label>Email ID</label>
                    <input type="text" class="form-control" id="txtEmail" name="txtEmail" placeholder="Enter Email ID">
                </div>
                <div class="col-md-6">
                    <label>Mobile Number</label>
                    <input type="text" class="form-control" id="txtMobile" name="txtMobile"
                        placeholder="Enter Mobile Number">
                </div>
                <div class="divider">
                    <span>Aadhaar Verification</span>
                </div>
                <label>Aadhar Card</label>
                <div class="col-md-6">
                    <label>Upload Front Side</label>
                    <div class="upload-box text-center">

                        <img id="prevpic1" src="./pics/upload_image.png" class="preview-img">
                        <input type="file" hidden id="pic1" name="pic1" onchange="doShowPrev(this,'prevpic1')">
                        <br>
                        <label for="pic1" class="btn btn-outline-primary profile-btn mt-3">Upload Pic</label>
                    </div>
                </div>
                <!-- Pic 2 -->
                <div class="col-md-6">
                    <label>Upload Back Side</label>
                    <div class="upload-box text-center">
                        <img id="prevpic2" src="./pics/upload_image.png" class="preview-img">
                        <input type="file" hidden id="pic2" name="pic2" onchange="doShowPrev(this,'prevpic2')">
                        <br>
                        <label for="pic2" class="btn btn-outline-primary profile-btn mt-3">Upload Pic</label>
                    </div>
                </div>
                <div class="text-center mb-4">
                    <button type="submit" class="btn btn-primary profile-btn">Save Record</button>
                </div>
            </form>
        </div>
    </center>
</body>

</html>
